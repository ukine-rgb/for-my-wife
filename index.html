<!DOCTYPE html>
<html>
<head>
  <title>I Love You ❤️</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #080808;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .love {
      position: absolute;
      color: #ff1744;
      font-size: 18px;
      font-weight: bold;
      text-shadow:
        0 0 5px #ff1744,
        0 0 15px #ff1744,
        0 0 30px #ff1744;
      white-space: nowrap;
      animation: float 6s linear forwards;
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      85% {
        opacity: 1;
      }

      to {
        transform: translateY(-20vh);
        opacity: 0;
      }
    }

    .center {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 60px;
      font-weight: bold;
      text-shadow: 0 0 20px white;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="center">I love you.</div>

  <script>
    function createLove() {
      const love = document.createElement("div");

      love.className = "love";
      love.textContent = "I love you";

      love.style.left = Math.random() * 100 + "vw";
      love.style.fontSize = (12 + Math.random() * 18) + "px";
      love.style.animationDuration = (4 + Math.random() * 5) + "s";

      document.body.appendChild(love);

      setTimeout(() => {
        love.remove();
      }, 10000);
    }

    setInterval(createLove, 150);
  </script>

</body>
</html>
